services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: course_scope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_scope"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - course_scope_postgres:/var/lib/postgresql/data

volumes:
  course_scope_postgres:

